<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文書発行システム</title>

    <!-- PWA Installation Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon.png">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght=300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS (予算管理連携用) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1 style="display: flex; justify-content: center; align-items: center; gap: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                注文書発行システム
            </h1>
        </header>

        <!-- SPA Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-create">新規発行</button>
            <button class="tab-btn" id="tab-history">発行履歴</button>
        </div>

        <main class="form-container">
            <!-- フォーム作成ビュー -->
            <div id="form-view">
                <form id="purchase-order-form">
                    <!-- 基本情報セクション -->
                    <section class="form-section card glass">
                        <h2>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"
                                stroke-linejoin="miter">
                                <rect x="3" y="4" width="18" height="18" rx="0" ry="0"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            基本情報・宛先
                        </h2>

                        <!-- 期と会社（自動採番用） -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="company-term">期 <span class="required">*</span></label>
                                <input type="number" id="company-term" name="company-term" placeholder="35" required>
                            </div>
                            <div class="form-group">
                                <label for="client-code">発注元会社 <span class="required">*</span></label>
                                <!-- Custom Autocomplete用 -->
                                <div style="position: relative;">
                                    <input type="text" id="client-code" name="client-code" class="form-input"
                                        list="code-list" placeholder="記号" required>
                                    <datalist id="code-list"></datalist>
                                </div>
                            </div>
                        </div>

                        <!-- 採番ボタン -->
                        <div class="auto-increment-btn-wrapper">
                            <button type="button" class="btn primary" id="btn-generate-number">自動採番する</button>
                        </div>

                        <!-- 注文書番号 -->
                        <div class="form-group">
                            <label for="order-number">注文書番号 <span class="required">*</span></label>
                            <input type="text" id="order-number" name="order-number" readonly required>
                        </div>

                        <!-- 発行日 -->
                        <div class="form-group">
                            <label for="issue-date">発行日 <span class="required">*</span></label>
                            <input type="date" id="issue-date" name="issue-date" required>
                        </div>

                        <div class="form-group" style="position: relative;">
                            <label for="company-name">宛名（会社名） <span class="required">*</span></label>
                            <!-- type="text" に変更し、カスタムドロップダウン制御のため autocomplete="off" を設定 -->
                            <input type="text" id="company-name" name="company-name" class="form-input"
                                autocomplete="off" placeholder="業者名を選択または手入力" required>
                            <ul id="custom-vendor-list" class="custom-dropdown" style="display: none;"></ul>
                        </div>

                        <!-- 宛先 -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="zip-code">郵便番号</label>
                                <!-- 〒自動付加するため type="text" とする -->
                                <input type="text" id="zip-code" name="zip-code">
                            </div>
                            <div class="form-group address-group">
                                <label for="address">住所</label>
                                <input type="text" id="address" name="address">
                            </div>
                        </div>

                        <!-- 貴見積書 -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="quote-number">貴見積書 番号</label>
                                <input type="text" id="quote-number" name="quote-number">
                            </div>
                            <div class="form-group">
                                <label for="quote-date">貴見積書 日付</label>
                                <input type="date" id="quote-date" name="quote-date">
                            </div>
                        </div>
                    </section>

                    <!-- 工事詳細セクション -->
                    <section class="form-section card glass">
                        <h2>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"
                                stroke-linejoin="miter">
                                <path d="M3 9l9-7 9 7v11a0 0 0 0 1 0 0H5a0 0 0 0 1 0 0z"></path>
                                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                            </svg>
                            工事詳細
                        </h2>

                        <!-- 予算管理連携：対象工事 -->
                        <div class="form-group">
                            <label for="linked-project">対象工事（予算管理連携）</label>
                            <select id="linked-project" name="linked-project">
                                <option value="">-- 選択してください --</option>
                            </select>
                        </div>

                        <!-- 予算管理連携：科目 -->
                        <div class="form-group">
                            <label for="budget-category">科目（予算管理連携）</label>
                            <select id="budget-category" name="budget-category">
                                <option value="construction">外注費</option>
                                <option value="materials">資機材費</option>
                                <option value="temporary">仮設費</option>
                                <option value="expenses">工事経費</option>
                            </select>
                        </div>

                        <!-- 予算管理連携：発注申請 -->
                        <div class="form-group" id="order-request-group" style="display: none;">
                            <label for="linked-order-request">発注申請（予算管理連携）</label>
                            <select id="linked-order-request" name="linked-order-request">
                                <option value="">-- 選択してください --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="project-name">工事名 <span class="required">*</span></label>
                            <input type="text" id="project-name" name="project-name" required>
                        </div>

                        <div class="form-group">
                            <label for="project-location">工事場所</label>
                            <input type="text" id="project-location" name="project-location">
                        </div>

                        <div class="form-group">
                            <label for="project-price">工事代金（税抜・円） <span class="required">*</span></label>
                            <input type="text" id="project-price" name="project-price" required>
                            <div class="price-preview" id="price-preview"
                                style="display: none; margin-top: 12px; padding: 14px; background: var(--google-primary-light, #e8f0fe); border: 1px solid var(--google-border, #dadce0); border-radius: 8px; font-size: 0.9em;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                    <span
                                        style="color: var(--google-text-sub, #5f6368); font-weight: 400;">消費税（10%）</span>
                                    <span id="tax-preview" style="color: var(--google-text, #202124); font-weight: 500;">-</span>
                                </div>
                                <div
                                    style="display: flex; justify-content: space-between; border-top: 1px solid var(--google-border, #dadce0); padding-top: 8px;">
                                    <span
                                        style="color: var(--google-text, #202124); font-weight: 500;">契約額（税込）</span>
                                    <span id="total-preview"
                                        style="color: var(--google-primary, #1a73e8); font-weight: 700; font-size: 1.1em;">-</span>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="project-start">着工日 <span class="required">*</span></label>
                                <input type="date" id="project-start" name="project-start" required>
                            </div>
                            <div class="form-group">
                                <label for="project-end">完工日 <span class="required">*</span></label>
                                <input type="date" id="project-end" name="project-end" required>
                            </div>
                        </div>

                        <div class="form-group" style="position: relative;">
                            <label for="order-content">発注内容 <span class="required">*</span></label>
                            <input type="text" id="order-content" name="order-content" autocomplete="off"
                                placeholder="選択または入力" required>
                            <ul id="custom-order-list" class="custom-dropdown" style="display: none;">
                                <!-- JSにて構築 -->
                            </ul>
                        </div>
                    </section>

                    <button type="submit" class="btn submit-btn">データ保存 ＆ 注文書（PDF）を発行</button>
                </form>
            </div>

            <!-- 発行履歴ビュー (SPA) -->
            <div id="history-view" style="display: none;">
                <section class="card glass">
                    <h2>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.2" stroke-linecap="square" stroke-linejoin="miter">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                        直近の発行履歴（各条件で最大50件）
                    </h2>

                    <!-- クライアントフィルター -->
                    <div class="sub-filter-tabs">
                        <button class="filter-btn active" data-comp="ALL">すべて</button>
                        <button class="filter-btn" data-comp="A">朝日工業社</button>
                        <button class="filter-btn" data-comp="T">鉄建建設</button>
                        <button class="filter-btn" data-comp="OTHER">その他</button>
                    </div>

                    <div id="history-loading" class="loading-text">
                        台帳データを取得しています...
                    </div>

                    <div class="history-table-wrapper" id="history-table-wrapper" style="display: none;">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>発行日</th>
                                    <th>発注番号</th>
                                    <th>宛名</th>
                                    <th>工事名</th>
                                    <th>工事代金</th>
                                    <th>成果物 (PDF)</th>
                                </tr>
                            </thead>
                            <tbody id="history-tbody">
                                <!-- JSで動的生成 -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="script.js?v=20260330"></script>
</body>

</html>
